[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growwapi"
version = "1.5.0.post1"
description = "Groww API SDK with patched certificate dependency constraints"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Groww" }]
dependencies = [
  "aiohttp>=3.11.18,<4.0.0",
  "certifi>=2026.10.18",
  "clint>=0.5.1,<0.6.0",
  "colorama>=0.4.6,<0.5.0",
  "google>=3.0.0,<4.0.0",
  "nats-py>=2.9.0,<3.0.0",
  "nkeys>=0.2.1,<0.3.0",
  "pandas>=2.2.3,<3.0.0",
  "protobuf>=5.29.0,<6.0.0",
  "pydantic>=2.10.2,<3.0.0",
  "pynacl>=1.5.0,<2.0.0",
  "requests>=2.32.3,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
