name: AllSafe AI Trading Full-Stack CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-verification:
    name: FastAPI Backend Security & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Backend Test Suite
        run: pytest -q

  frontend-verification:
    name: Next.js Frontend Unit Tests, Typecheck, Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Frontend Dependencies
        run: npm install
      - name: Run Frontend Unit & Security Integration Tests
        run: |
          node --test tests/marketData.test.mjs
          node --test tests/landingPage.test.mjs
          node --test tests/portalIntegrationAndSecurity.test.mjs
      - name: Run TypeScript Typecheck
        run: npm run typecheck
      - name: Run ESLint
        run: npm run lint
      - name: Run Next.js Production Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://allsafe-ai-api.onrender.com
          API_BASE_URL: https://allsafe-ai-api.onrender.com
        run: npm run build
