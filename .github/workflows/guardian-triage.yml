name: Guardian AI triage
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'
permissions:
  contents: read
concurrency:
  group: guardian-ai-triage
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public routes and request incident analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          results = {}
          for route in ("/", "/login", "/admin/login", "/privacy", "/what-we-done"):
              try:
                  with urllib.request.urlopen("https://allsafe-ai-trading.vercel.app" + route, timeout=15) as response:
                      results[route] = response.status
              except urllib.error.HTTPError as exc:
                  results[route] = exc.code
              except (OSError, TimeoutError):
                  results[route] = "transport_error"
          report = {"checks": results}
          Path("guardian-triage.json").write_text(json.dumps(report, indent=2))
          if all(value == 200 for value in results.values()):
              print("Public routes healthy; no AI request needed")
              raise SystemExit(0)
          key = os.environ.get("GROQ_API_KEY")
          if not key:
              raise SystemExit("Groq credential unavailable")
          base = "https://api.groq.com/openai/v1/"
          def request(path, payload=None):
              req = urllib.request.Request(base + path, data=None if payload is None else json.dumps(payload).encode(), headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"Groq HTTP {exc.code}") from None
          models = request("models").get("data", [])
          available = {m["id"] for m in models}
          model = next((m for m in ("llama-3.3-70b-versatile","llama-3.1-8b-instant") if m in available), None)
          if not model:
              raise SystemExit("No configured Groq model available")
          prompt = "Analyze public HTTP status observations, give possible causes and safe diagnostic steps, without claiming proven root cause or requesting secrets: " + json.dumps(results)
          result = request("chat/completions", {"model":model,"messages":[{"role":"user","content":prompt}],"max_tokens":512})
          answer = result.get("choices",[{}])[0].get("message",{}).get("content","")
          if not answer.strip():
              raise SystemExit("No generated text returned")
          report["model"] = model
          report["analysis"] = answer
          Path("guardian-triage.json").write_text(json.dumps(report, indent=2))
          raise SystemExit("Public route incident detected")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-triage
          path: guardian-triage.json
          retention-days: 14
