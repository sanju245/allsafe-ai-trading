name: Guardian AI triage
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'
permissions:
  contents: read
concurrency:
  group: guardian-ai-triage
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public routes and request incident analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          results = {}
          for route in ("/", "/login", "/admin/login", "/privacy", "/what-we-done"):
              try:
                  with urllib.request.urlopen("https://allsafe-ai-trading.vercel.app" + route, timeout=15) as response:
                      results[route] = response.status
              except urllib.error.HTTPError as exc:
                  results[route] = exc.code
              except (OSError, TimeoutError):
                  results[route] = "transport_error"
          report = {"checks": results}
          Path("guardian-triage.json").write_text(json.dumps(report, indent=2))
          if all(value == 200 for value in results.values()):
              print("Public routes healthy; no AI request needed")
              raise SystemExit(0)
          key = os.environ.get("GEMINI_API_KEY")
          if not key:
              raise SystemExit("Gemini credential unavailable")
          base = "https://generativelanguage.googleapis.com/v1beta/"
          def request(path, payload=None):
              req = urllib.request.Request(base + path, data=None if payload is None else json.dumps(payload).encode(), headers={"x-goog-api-key":key,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"Gemini HTTP {exc.code}") from None
          models = request("models").get("models", [])
          candidates = sorted(m["name"] for m in models if "flash" in m["name"] and "generateContent" in m.get("supportedGenerationMethods",[]) and not any(x in m["name"] for x in ("preview","experimental","image","audio","tts")))
          if not candidates:
              raise SystemExit("No eligible model")
          prompt = "Analyze these public HTTP status observations. Give possible causes and safe diagnostic steps. Do not claim a root cause is proven or request secrets. Observations: " + json.dumps(results)
          response = request(candidates[-1]+":generateContent", {"contents":[{"parts":[{"text":prompt}]}],"generationConfig":{"maxOutputTokens":1024}})
          report["model"] = candidates[-1]
          report["analysis"] = [p["text"] for c in response.get("candidates",[]) for p in c.get("content",{}).get("parts",[]) if "text" in p and not p.get("thought")]
          Path("guardian-triage.json").write_text(json.dumps(report, indent=2))
          raise SystemExit("Public route incident detected")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-triage
          path: guardian-triage.json
          retention-days: 14
