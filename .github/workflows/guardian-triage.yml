name: Guardian AI triage
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'
permissions:
  contents: read
concurrency:
  group: guardian-ai-triage
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Guardian retry and provider limits
        run: python -m unittest discover -s scripts -p 'test_guardian_repair.py' -v
      - name: Probe public routes and diagnose persistent incidents
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/guardian_repair.py
      - name: Classify untrusted candidate as evidence only
        if: always()
        shell: bash
        run: |
          if [[ ! -s guardian-candidate.patch ]]; then
            echo "No code candidate; persistent incidents require investigation"
            exit 0
          fi
          python scripts/guardian_candidate.py guardian-candidate.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-triage
          path: |
            guardian-triage.json
            guardian-candidate.patch
          if-no-files-found: error
          retention-days: 14
