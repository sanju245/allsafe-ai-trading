name: AllSafe Guardian monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
permissions:
  contents: read
concurrency:
  group: guardian-monitor
  cancel-in-progress: false
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public routes
        shell: bash
        run: |
          set -u
          failed=0
          for route in / /login /admin/login /privacy /what-we-done; do
            if code=$(curl --silent --show-error --location --max-redirs 3 --connect-timeout 10 --max-time 30 --retry 2 --output /dev/null --write-out '%{http_code}' "https://allsafe-ai-trading.vercel.app${route}"); then
              echo "$route HTTP $code" | tee -a guardian-report.txt
              [[ "$code" == 200 ]] || failed=1
            else
              echo "$route transport failure" | tee -a guardian-report.txt
              failed=1
            fi
          done
          exit "$failed"
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-public-smoke
          path: guardian-report.txt
          retention-days: 14
