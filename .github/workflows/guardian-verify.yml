name: Guardian verification
on:
  push:
    branches:
      - feature/allsafe-ai-guardian
      - 'guardian/repair/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_STREAM_ENABLED: 'false'
      UPSTOX_LIVE_STREAM_ENABLED: 'false'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=guardian-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-backend-tests
          path: apps/api/guardian-tests.xml
          retention-days: 14
